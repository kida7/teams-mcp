name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Update npm for Trusted Publishing
        run: npm install -g npm@latest

      - run: npm ci
      - run: npm run ci
      - run: npm test
      - run: npm publish --provenance
